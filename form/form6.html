
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Championship Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(
        to bottom right,
        #dba9ed,
        #b9c9f8,
        #a2f0f5
    );
    padding: 35px;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
      border: 2px solid rgb(57, 57, 57);
}

h1 {
    font-size: 42px;
    font-weight: 400;
    color: #55516f;
    margin-bottom: 35px;
}

.form-group {
    margin-bottom: 32px;
}

.form-group label,
.verification > label {
    display: block;
    font-size: 22px;
    color: #66617f;
    margin-bottom: 15px;
}

label span {
    color: #e74c3c;
    font-weight: bold;
}

input[type="text"],
input[type="email"],
input[type="tel"] {
    width: 100%;
    height: 53px;
    background-color: #ffffff;
    border: 1px solid #dddddd;
    border-radius: 3px;
    padding: 0 12px;
    font-size: 18px;
    outline: none;
}

input::placeholder {
    color: #aaaaaa;
}

input:focus {
    border-color: #4776d0;
}

.name-fields {
    display: flex;
    gap: 20px;
}

.name-fields input {
    flex: 1;
    min-width: 0;
}

.verification {
    width: 400px;
    margin: 35px auto 30px;
}

.verification > label {
    margin-bottom: 15px;
}

.captcha {
    width: 360px;
    height: 95px;
    background-color: #ffffff;
    border: 1px solid #dddddd;
    border-radius: 3px;
    display: flex;
    align-items: center;
    padding: 15px;
    gap: 15px;
}

.captcha input {
    width: 32px;
    height: 32px;
    cursor: pointer;
}

.captcha p {
    font-size: 16px;
    color: #333333;
}

.captcha-logo {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #666666;
}

.captcha-logo small {
    font-size: 10px;
}

button {
    display: block;
    width: 170px;
    height: 63px;
    margin: auto;
    background-color: #1553c7;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #1045a8;
}

</style>
<body>

    <div class="container">

        <h1>School Championship Registration Form</h1>

        <form>
            <div class="form-group">
                <label>School name:<span>*</span></label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Schooler name:<span>*</span></label>

                <div class="name-fields">
                    <input type="text" placeholder="First" required>
                    <input type="text" placeholder="Last" required>
                </div>
            </div>

            <div class="form-group">
                <label>Parent name:<span>*</span></label>

                <div class="name-fields">
                    <input type="text" placeholder="First" required>
                    <input type="text" placeholder="Last" required>
                </div>
            </div>

            <div class="form-group">
                <label>Parent phone:<span>*</span></label>
                <input type="tel" placeholder="### ### ####" required>
            </div>

            <div class="form-group">
                <label>Parent email:<span>*</span></label>
                <input type="email" required>
            </div>

            <div class="form-group">
                <label>Preferred sport:<span>*</span></label>
                <input type="text" required>
            </div>
            <div class="verification">

                <label>Verification<span>*</span></label>

                <div class="captcha">
                    <input type="checkbox" required>
                    <p>I'm not a robot</p>

                    <div class="captcha-logo">
                        <small>reCAPTCHA</small>
                        <small>Privacy - Terms</small>
                    </div>
                </div>

            </div>
            <button type="submit">
                 Submit
            </button>

        </form>

    </div>

</body>
</html>
