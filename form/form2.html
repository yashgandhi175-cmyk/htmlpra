
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/fe185dde3d.js" crossorigin="anonymous"></script>

</head>

<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {
    background-color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    color: #f5f5f5;
}

.container {
    display: flex;
    width: 92%;
    height: 458px;
    margin: 18px auto;
    background-color: #152027;
    border-top: 2px solid #795548;
}

.left-section {
    width: 50%;
    background-color: #0b1113;
    border-right: 1px solid #34444d;
    position: relative;
    padding: 35px 25px;
}

.instagram-logo {
    font-size: 60px;
    width: 65px;
    height: 60px;

    background: linear-gradient(
        45deg,
        #ffdc80,
        #fcaf45,
        #f77737,
        #e1306c,
        #c13584,
        #833ab4
    );
}

.heading {
    text-align: center;
    margin-top: 25px;
}

.heading h2 {
    font-size: 25px;
    font-weight: 500;
    margin-bottom: 25px;
}

.heading span {
    background: linear-gradient(
        90deg,
        #ff7a00,
        #ff0069,
        #d300c5
    );
}

.image-section {
    width: 200px;
    height: 190px;
    margin: 25px auto 0;
}

.image-section img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.app-store {
    position: absolute;
    bottom: 15px;
    right: -10px;

    padding: 5px 10px;
    font-size: 11px;
    border-radius: 5px;
}

.right-section {
    width: 50%;
    background-color: #152027;

    display: flex;
    justify-content: center;

    padding: 88px 32px 20px;
}

.login-form {
    width: 100%;
    max-width: 400px;

    display: flex;
    flex-direction: column;
}

.login-form label {
    font-size: 12px;
    margin-bottom: 20px;
    font-weight: 500;
}

.login-form input {
    width: 100%;
    height: 49px;

    margin-bottom: 10px;
    padding: 10px;

    background-color: #152027;
    border: 1px solid #344955;
    border-radius: 12px;

    color: white;
    font-size: 12px;
}

.login-form input::placeholder {
    color: #9baab4;
}

.login-form input:focus {
    border-color: #8296a5;
}

.login-btn {
    width: 100%;
    height: 37px;

    margin-top: 10px;

    border: none;
    border-radius: 25px;

    background-color: #174477;
    color: #7191b5;

    font-size: 12px;
    cursor: pointer;
}

.login-btn:hover {
    background-color: #20558d;
}

.forgot-password {
    text-align: center;

    margin-top: 22px;

    font-size: 12px;
    color: #e4e4e4;

    text-decoration: none;
}

.facebook-btn {
    width: 100%;
    height: 37px;

    margin-top: 53px;

    border: 1px solid #344955;
    border-radius: 25px;

    background-color: transparent;
    color: #e4e4e4;

    font-size: 12px;
    cursor: pointer;
}

.facebook-btn i {
    color: #0095f6;
    font-size: 15px;
    margin-right: 5px;
}

.create-account {
    width: 100%;
    height: 37px;

    margin-top: 10px;

    border: 1px solid #2478bd;
    border-radius: 25px;

    background-color: transparent;
    color: #0095f6;

    font-size: 12px;
    cursor: pointer;
}

</style>

<body>

    <div class="container">

        <div class="left-section">
            <div class="instagram-logo">
              <i class="fa-brands fa-instagram"></i> 
            </div>

            <div class="heading">
                <h2>See everyday moments from</h2>

                <h2>
                    you <span>close friends</span>.
                </h2>
            </div>

            <div class="image-section">
                <img src="#" alt="Instagram">
            </div>

            <div class="app-store">
                <i class="fa-brands fa-apple"></i>App Store
            </div>

        </div>

        <div class="right-section">

            <form class="login-form">

                <label>Log into Instagram</label>
                <input type="text" placeholder="Mobile number, username or email" required>

                <input type="password" placeholder="Password" required>

                <button type="submit" class="login-btn">
                    Log in
                </button>

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>

                <button type="button" class="facebook-btn">
                    <i class="fa-brands fa-facebook"></i>
                         Log in with Facebook

                </button>

                <button type="button" class="create-account">
                    Create new account
                </button>

            </form>

        </div>

    </div>

</body>

</html>
