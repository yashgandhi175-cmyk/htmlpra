
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/fe185dde3d.js" crossorigin="anonymous"></script>
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(to right, #35633e, #8c9d0d);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 1100px;
    min-height: 580px;
    background-color: white;
    border-radius: 40px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

.welcome-section {
    width: 50%;
    background-color: #004953;
    color: white;
    border-radius: 40px 150px 150px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px;
}

.welcome-section h1 {
    font-size: 40px;
    margin-bottom: 30px;
}

.welcome-section p {
    font-size: 20px;
    line-height: 28px;
    max-width: 400px;
    margin-bottom: 40px;
}

.sign-in-btn {
    width: 200px;
    height: 55px;
    background-color: transparent;
    color: white;
    border: 2px solid white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.sign-in-btn:hover {
    background-color: white;
    color: #004953;
}

.registration-section {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
}

.registration-section h1 {
    font-size: 40px;
    color: black;
    margin-bottom: 30px;
}

.social-icons {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
}

.social-icons a {
    width: 55px;
    height: 55px;
    border: 2px solid #7a9fa5;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    color: #004953;
    font-size: 20px;
}

.social-icons a:hover {
    background-color: #004953;
    color: white;
}

.registration-section h2 {
    font-size: 40px;
    color: black;
    margin-bottom: 5px;
}

.form-text {
    font-size: 16px;
    color: #555;
    margin-bottom: 10px;
    text-align: center;
}

form {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

form input {
    width: 100%;
    height: 52px;
    background-color: #cccccc;
    border: none;
    outline: none;
    padding: 0 20px;
    font-size: 18px;
    margin-bottom: 22px;
}

form input::placeholder {
    color: #888888;
}

.sign-up-btn {
    width: 210px;
    height: 55px;
    background-color: #c0c000;
    color: white;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 3px;
}

.sign-up-btn:hover {
    background-color: #a8a800;
}

</style>
<body>

    <div class="container">
        <div class="welcome-section">

            <h1>Welcome Back!</h1>

            <p>
                Provide your personal details to use all features
            </p>

            <button class="sign-in-btn">SIGN IN</button>

        </div>
        <div class="registration-section">

            <h1>Register With</h1>
            <div class="social-icons">

                <a href="#"><i class="fa-brands fa-google-plus-g"></i></a>

                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>

                <a href="#"><i class="fa-brands fa-github"></i></a>

                <a href="#"><i class="fa-brands fa-linkedin"></i></a>

            </div>

            <h2>OR</h2>

            <p class="form-text">
                Fill Out The Following Info For Registration
            </p>
            <form>

                <input type="text" placeholder="Name" required>

                <input type="email" placeholder="Email" required>

                <input type="password" placeholder="Password" required>

                <button type="submit" class="sign-up-btn">
                    SIGN UP
                </button>

            </form>

        </div>

    </div>

</body>
</html>
