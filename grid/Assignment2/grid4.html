
<!DOCTYPE html>
<html>
<head>
    <title>Art Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #f0f0f0;
    padding: 30px;
}

.gallery {
    display: grid;

    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 180px);

    grid-template-areas:
        "img1 img2 img3"
        "img4 img5 img6"
        "img7 img8 img9";

    gap: 15px;

    max-width: 600px;
    margin: auto;
}

.gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;

    border: 5px solid white;
}

.img1 {
    grid-area: img1;
}

.img2 {
    grid-area: img2;
}

.img3 {
    grid-area: img3;
}

.img4 {
    grid-area: img4;
}

.img5 {
    grid-area: img5;
}

.img6 {
    grid-area: img6;
}

.img7 {
    grid-area: img7;
}

.img8 {
    grid-area: img8;
}

.img9 {
    grid-area: img9;
}

.img2 {
    grid-row: 1 / 3;
    grid-column: 2;
    z-index: 1;
    height: 260px !important;
    transform: translateY(-30px);
}

</style>
<body>

    <div class="gallery">

        <img class="img1" src="image1.jpg" alt="Photo 1">
        <img class="img2" src="image2.jpg" alt="Photo 2">
        <img class="img3" src="image3.jpg" alt="Photo 3">

        <img class="img4" src="image4.jpg" alt="Photo 4">
        <img class="img5" src="image5.jpg" alt="Photo 5">
        <img class="img6" src="image6.jpg" alt="Photo 6">

        <img class="img7" src="image7.jpg" alt="Photo 7">
        <img class="img8" src="image8.jpg" alt="Photo 8">
        <img class="img9" src="image9.jpg" alt="Photo 9">

    </div>

</body>
</html>
