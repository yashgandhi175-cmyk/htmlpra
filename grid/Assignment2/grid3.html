
<!DOCTYPE html>
<html>
<head>
    <title>Responsive CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: white;
    padding: 20px;
}

.container {
    display: grid;

    grid-template-columns: 1fr 1fr 1fr 1fr;

    grid-template-rows: 40px 100px 100px 100px 40px;

    grid-template-areas:
        "navbar navbar navbar navbar"
        "sidebar main main main"
        "sidebar content1 content2 content3"
        "sidebar content1 content2 content3"
        "footer footer footer footer";

    gap: 5px;

    max-width: 600px;
    margin: auto;
}

header {
    grid-area: navbar;
    background-color: #a7f3e0;
}

nav {
    grid-area: sidebar;
    background-color: #00e5e5;
}

main {
    grid-area: main;
    background-color: #80ffff;
}

.content1 {
    grid-area: content1;
    background-color: #66f5cf;
}

.content2 {
    grid-area: content2;
    background-color: #4deac0;
}

.content3 {
    grid-area: content3;
    background-color: #66f5b0;
}

footer {
    grid-area: footer;
    background-color: #00d9a5;
}

header, nav, main, .content1, .content2, .content3, footer {
    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 12px;
    color: black;
}

@media (max-width: 600px) {

    .container {
        grid-template-columns: 1fr;

        grid-template-rows: 40px 30px 200px 100px 100px 100px 40px;

        grid-template-areas:
            "navbar"
            "sidebar"
            "main"
            "content1"
            "content2"
            "content3"
            "footer";
    }

}

</style>
<body>

    <div class="container">

        <header>NAVBAR</header>

        <nav>SIDEBAR</nav>

        <main>MAIN</main>

        <div class="content1">CONTENT 1</div>

        <div class="content2">CONTENT 2</div>

        <div class="content3">CONTENT 3</div>

        <footer>FOOTER</footer>

    </div>

</body>
</html>
