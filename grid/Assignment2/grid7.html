
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid Layout</title>
<link rel="stylesheet" href="">
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 15px;
    background: #ffffff;
}

.container {
    width: 650px;
    max-width: 100%;
    border: 7px solid #222;
    padding: 15px;
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-rows: 70px 70px 275px 70px;
    gap: 5px;
}

.box {
    border: 3px solid #777;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #639b43;
    font-size: 30px;
    text-align: center;
}

.header {
    grid-column: 1 / 4;
    grid-row: 1;
}

.navigation {
    grid-column: 1 / 4;
    grid-row: 2;
}

.left-content {
    grid-column: 1;
    grid-row: 3;
}

.main-content {
    grid-column: 2;
    grid-row: 3;
}

.right-content {
    grid-column: 3;
    grid-row: 3;
}

.footer {
    grid-column: 1 / 4;
    grid-row: 4;
}

</style>
</head>

<body>

<div class="container">

    <header class="box header">
        Header
    </header>

    <nav class="box navigation">
        Navigation Menu
    </nav>

    <aside class="box left-content">
        Content
    </aside>

    <main class="box main-content">
        Main<br>Content
    </main>

    <aside class="box right-content">
        Content
    </aside>

    <footer class="box footer">
        Footer
    </footer>

</div>

</body>
</html>
